name: Regression Gate

# Wave 7.2: nightly schedule added, but a live bench run needs provider keys
# (repo secrets). The job skips itself when no key is configured — a scheduled
# run that always fails without secrets is noise, not signal. Manual dispatch
# always runs (the dispatcher is expected to have set secrets).
on:
  workflow_dispatch:
    inputs:
      session:
        description: "Benchmark session id (must have a baseline + candidate variant)"
        required: true
        default: "frontier-spot-check"
      baseline:
        description: "Baseline variant id"
        required: true
        default: "bare-llm"
      candidate:
        description: "Candidate variant id"
        required: true
        default: "ra-full"
  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Run + gate a benchmark session
    runs-on: ubuntu-latest
    # NOTE: job-level `if` CANNOT read the secrets context (GitHub rejects the
    # workflow file outright: "Unrecognized named-value: 'secrets'"). While that
    # error stood, GitHub turned this file into a placeholder that failed at 0s
    # on EVERY push to ANY branch. The keyless-skip therefore lives in a
    # step-level `if` (secrets/env are available at step scope), not at job level.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      # Keyless-safe skip: scheduled runs on forks/secrets-less repos exit green
      # without burning minutes. Manual dispatch with secrets runs.
      - name: Mark scheduled runs keyless-safe to skip
        id: guard
        if: github.event_name == 'schedule' && env.ANTHROPIC_API_KEY == ''
        run: echo "skip=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          bun-version: "1.3.10"

      - name: Cache Bun install
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build packages
        if: steps.guard.outputs.skip != 'true'
        run: bun run build

      - name: Run benchmark session
        if: steps.guard.outputs.skip != 'true'
        # Schedule events have no workflow_dispatch inputs — fall back to the
        # dispatch defaults so a keyed nightly run has a session to bench.
        run: bun run apps/cli/src/index.ts bench --session "${{ github.event_name == 'schedule' && 'frontier-spot-check' || inputs.session }}" --output report.json

      - name: Gate the report (fails on reject)
        if: steps.guard.outputs.skip != 'true'
        run: bun run apps/cli/src/index.ts eval gate --report report.json --baseline "${{ github.event_name == 'schedule' && 'bare-llm' || inputs.baseline }}" --candidate "${{ github.event_name == 'schedule' && 'ra-full' || inputs.candidate }}"

      - name: Upload report
        if: steps.guard.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: session-report
          path: report.json
