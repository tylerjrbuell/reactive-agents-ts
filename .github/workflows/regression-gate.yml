name: Regression Gate (advisory)

# ADVISORY (2026-11-03, owner decision): manual dispatch only, never blocks.
# A `reject` verdict is surfaced as a warning annotation plus the uploaded
# gate.txt, and the job still exits 0. The weekly schedule was removed to avoid
# a recurring frontier spend (~60 runs per dispatch). Default-path decisions are
# gated on the local H3 suite (packages/benchmarks/src/h3) instead.
# The job skips itself when no provider key is configured.
on:
  workflow_dispatch:
    inputs:
      session:
        description: "Benchmark session id (must have a baseline + candidate variant)"
        required: true
        default: "frontier-spot-check"
      baseline:
        description: "Baseline variant id"
        required: true
        default: "bare-llm"
      candidate:
        description: "Candidate variant id"
        required: true
        default: "ra-full"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Run + gate a benchmark session
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context is NOT available in any `if` conditional on
    # GitHub Actions (job- or step-level). Benchmark secrets reach the run
    # script via the step-level env below; the keyless-skip decision is bash,
    # not YAML conditionals.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Benchmark session (install, build, bench, gate)
        # Keyless-scheduled-run skip: GitHub Actions provides the `secrets`
        # context in env blocks but NOT in any `if` conditional (both job-level
        # and step-level `if` fail runtime-file validation with "Unrecognized
        # named-value: 'secrets'" — verified on CI runs 39347272779 and
        # 39356471098). The keyless check therefore lives in bash, reading the
        # env value GitHub populated from the secret. A secrets-less repo (fork
        # schedule, manual dispatch before wiring keys) exits green without
        # burning minutes; scheduled runs WITH keys proceed.
        # Scheduled events carry no workflow_dispatch inputs (required or not);
        # fall back to the same defaults the dispatch form pins.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::Keyless run (ANTHROPIC_API_KEY absent): benchmark session skipped (green no-op)."
            exit 0
          fi
          set -e
          bun install --frozen-lockfile
          bun run build
          # Power: the lift gate (packages/benchmarks/src/gate/types.ts
          # DEFAULT_LIFT_POLICY) needs minRuns=3 per cell, or every tier is
          # `underpowered` and the gate exits 0 whatever happened. `rax bench`
          # has no --runs flag, so call the bench runner directly with --runs 3.
          # Cost bound: the two cheapest frontier tiers only (haiku, plus
          # gpt-4o-mini when its key is set) x 5 tasks x 2 variants x 3 runs.
          # Every frontier-spot-check task is graded deterministically
          # (expected-pattern or verifiable hidden check): no judge-server needed.
          MODELS="claude-haiku-4-5"
          if [ -n "${OPENAI_API_KEY:-}" ]; then MODELS="$MODELS,gpt-4o-mini"; fi
          bun run packages/benchmarks/src/run.ts --session "${{ inputs.session || 'frontier-spot-check' }}" \
            --models "$MODELS" --runs 3 --output report.json
          # Advisory: every verdict is reported as an annotation; the job never fails on it.
          set +e
          bun run apps/cli/src/index.ts eval gate --report report.json \
            --baseline "${{ inputs.baseline || 'bare-llm' }}" --candidate "${{ inputs.candidate || 'ra-full' }}" | tee gate.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -q "UNDERPOWERED" gate.txt; then
            echo "::warning::Lift gate verdict is UNDERPOWERED (a cell has fewer than 3 measured runs); see gate.txt."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Lift gate verdict is REJECT (advisory, job not failed); see gate.txt."
          fi
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-report
          path: |
            report.json
            gate.txt
