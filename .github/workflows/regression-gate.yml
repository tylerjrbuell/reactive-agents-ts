name: Regression Gate

# Wave 7.2: nightly schedule added, but a live bench run needs provider keys
# (repo secrets). The job skips itself when no key is configured — a scheduled
# run that always fails without secrets is noise, not signal. Manual dispatch
# always runs (the dispatcher is expected to have set secrets).
on:
  workflow_dispatch:
    inputs:
      session:
        description: "Benchmark session id (must have a baseline + candidate variant)"
        required: true
        default: "frontier-spot-check"
      baseline:
        description: "Baseline variant id"
        required: true
        default: "bare-llm"
      candidate:
        description: "Candidate variant id"
        required: true
        default: "ra-full"
  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Run + gate a benchmark session
    runs-on: ubuntu-latest
    # Keyless-safe skip: scheduled runs on forks/secrets-less repos exit
    # green without burning minutes. Manual dispatch with secrets runs.
    if: ${{ github.event_name != 'schedule' || secrets.ANTHROPIC_API_KEY != '' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run benchmark session
        run: bun run apps/cli/src/index.ts bench --session "${{ inputs.session }}" --output report.json

      - name: Gate the report (fails on reject)
        run: bun run apps/cli/src/index.ts eval gate --report report.json --baseline "${{ inputs.baseline }}" --candidate "${{ inputs.candidate }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-report
          path: report.json
