name: Regression Gate

# Wave 7.2: nightly schedule added, but a live bench run needs provider keys
# (repo secrets). The job skips itself when no key is configured — a scheduled
# run that always fails without secrets is noise, not signal. Manual dispatch
# always runs (the dispatcher is expected to have set secrets).
on:
  workflow_dispatch:
    inputs:
      session:
        description: "Benchmark session id (must have a baseline + candidate variant)"
        required: true
        default: "frontier-spot-check"
      baseline:
        description: "Baseline variant id"
        required: true
        default: "bare-llm"
      candidate:
        description: "Candidate variant id"
        required: true
        default: "ra-full"
  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Run + gate a benchmark session
    runs-on: ubuntu-latest
    # Keyless-safe skip: scheduled runs on forks/secrets-less repos exit
    # green without burning minutes. Manual dispatch with secrets runs.
    # NOTE: this cannot live in the job-level `if` — GitHub rejects the
    # `secrets` context there at parse time ("Unrecognized named-value:
    # 'secrets'"). The decision is exported by the guard step below and the
    # substantive steps gate on it.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Keyless-scheduled-run guard
        id: keyless-guard
        if: ${{ github.event_name == 'schedule' && secrets.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Scheduled run on a secrets-less repo: benchmark session skipped (green no-op)."

      - name: Cache Bun install
        if: ${{ steps.keyless-guard.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ steps.keyless-guard.outputs.skip != 'true' }}
        run: bun install --frozen-lockfile

      - name: Build packages
        if: ${{ steps.keyless-guard.outputs.skip != 'true' }}
        run: bun run build

      - name: Run benchmark session
        if: ${{ steps.keyless-guard.outputs.skip != 'true' }}
        # Scheduled events carry no workflow_dispatch inputs (required or not);
        # fall back to the same defaults the dispatch form pins.
        run: bun run apps/cli/src/index.ts bench --session "${{ inputs.session || 'frontier-spot-check' }}" --output report.json

      - name: Gate the report (fails on reject)
        if: ${{ steps.keyless-guard.outputs.skip != 'true' }}
        run: bun run apps/cli/src/index.ts eval gate --report report.json --baseline "${{ inputs.baseline || 'bare-llm' }}" --candidate "${{ inputs.candidate || 'ra-full' }}"

      - name: Upload report
        if: ${{ !cancelled() && steps.keyless-guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: session-report
          path: report.json
