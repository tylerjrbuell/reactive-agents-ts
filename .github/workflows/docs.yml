name: Deploy Docs

on:
  # Deploys come from main only: the github-pages environment admits branch
  # `main` and nothing else. No `tags:` trigger: the v0.19.1 tag run was
  # rejected ("Tag "v0.19.1" is not allowed to deploy to github-pages due to
  # environment protection rules") and, through a shared concurrency group,
  # cancelled the main deploy. A release moves the docs version (header chip,
  # What's New badge, New/Updated window) through publish.yml instead: after
  # it syncs VERSION/CHANGELOG to main it runs
  # `gh workflow run docs.yml --ref main -f version=<version>`.
  # Pinned by tools/repo/tests/docs-workflow.test.ts and the
  # `workflow-invariants` gate (bun run repo check --only workflow-invariants).
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  # On a branch other than main this builds without deploying: use it to
  # exercise a docs build change before it lands on main.
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version (RA_DOCS_VERSION), e.g. 0.19.1. Empty: the highest reachable v* tag."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so a run on another ref never shares the group with a main
# deploy. No cancel-in-progress: a started deploy finishes; a newer main run
# waits and replaces only a pending one (GitHub's Pages starter does the same).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # new-page-indicator runs `git log --follow` per doc to date pages.
          # Default depth-1 collapses history to one commit, so only pages
          # touched in the deploy commit get the badge. Full history = parity
          # with local.
          fetch-depth: 0
          # The docs version (header chip, What's New badge, New/Updated
          # window) is the latest reachable v* tag; see
          # apps/docs/src/content/indicators.ts `deriveCurrentVersion`.
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7 needs Node >=22.23.4; '22.23' keeps a runner image from going below it.
          node-version: '22.23'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      # T1.2 — Cache Bun's install dir.
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro site
        working-directory: apps/docs
        env:
          # Set by publish.yml's release dispatch; empty on pushes, where
          # deriveCurrentVersion falls back to the highest reachable v* tag.
          RA_DOCS_VERSION: ${{ inputs.version }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # github-pages admits main only; a dispatch on any other ref builds and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
