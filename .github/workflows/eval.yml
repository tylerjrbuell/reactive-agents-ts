name: Eval Suite

# Wave 7.2 root-cause: every step of this workflow passes keyless locally
# (benchmarks 7/0, eval 62/0, suite schemas valid), so the historic
# "always failing" was stale, not structural. Re-enabled on PR + nightly,
# scoped to what ci.yml's `bun test` does NOT already cover (benchmarks +
# suite-schema validation). Full `bun test packages/eval/` stays in CI;
# duplicating it here would burn minutes for zero signal.
on:
  pull_request:
  # Nightly drift lane (keyless-safe steps only).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# T1.1 — Concurrency cancellation for the same workflow + ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run Eval Suite
    runs-on: ubuntu-latest
    # Timeout guard: cold-runner install + build + benchmarks must finish.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      # T1.2 — Cache Bun's install dir.
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run performance benchmarks
        run: bun test packages/eval/tests/benchmarks.test.ts

      - name: Validate bundled eval suite schemas
        run: |
          node -e "
            const fs = require('fs');
            const suites = ['basic-qa', 'reasoning-quality', 'tool-selection', 'safety'];
            for (const s of suites) {
              const data = JSON.parse(fs.readFileSync('packages/eval/suites/' + s + '.json', 'utf-8'));
              if (!data.id || !data.cases || !data.dimensions) {
                console.error('Invalid suite: ' + s);
                process.exit(1);
              }
              console.log('✓ ' + s + ': ' + data.cases.length + ' cases, dimensions: ' + data.dimensions.join(', '));
            }
            console.log('All suites valid.');
          "
