name: Prices

# Weekly drift check of llm-provider's bundled price snapshot against LiteLLM's
# live table. Runs prices:update and fails, with the row diff in the job log,
# when any price row changed. It opens no PR and uses no secrets: a maintainer
# runs `bun run prices:update` locally, reviews, and commits.
# The repo gate (check-prices) stays offline and only warns on age.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Price snapshot drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Regenerate snapshot; fail if any price row changed
        run: bun run prices:update --fail-on-drift
