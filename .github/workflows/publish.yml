name: Publish to npm

# Tag-driven lockstep release. Push a `vX.Y.Z` tag → this workflow stamps every
# public package to that version, aggregates the changelog, builds, and publishes
# in dependency order (see scripts/release.ts). No changesets/action, no
# "Version Packages" PR — the tag is the version source and the audit point.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to release (e.g. 0.11.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

# One release at a time. A second tag push waits rather than racing npm.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # No `registry-url:` — it makes setup-node write a placeholder
      # $RUNNER_TEMP/.npmrc and export NPM_CONFIG_USERCONFIG pointing at it.
      # bun honors NPM_CONFIG_USERCONFIG but does NOT expand the
      # ${NODE_AUTH_TOKEN} placeholder, so `bun publish` fails auth. Omitting
      # registry-url leaves $HOME/.npmrc as the sole npm/bun config path.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Resolve the target version from the tag (push) or the manual input.
      # `release.ts` requires an explicit semver — this is its single source.
      - name: Resolve release version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not valid semver (tag must be vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # The post-publish sync step below resets to `origin/main` and reapplies
      # only VERSION/CHANGELOG/package.json on top of it — it does not carry
      # the tagged commit's own ancestry. If `origin/main` is behind the
      # tagged commit (main pushed after the tag, or not at all), that sync
      # discards every commit main is missing and lands its own commit on
      # stale history, corrupting main's ancestry (2026-09-05 incident,
      # v0.16.0). Fail fast here instead of silently degrading.
      - name: Guard — origin/main must already contain this release
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::origin/main is NOT an ancestor of the tagged commit ($GITHUB_SHA)."
            echo "::error::Push main first: git push origin main — THEN tag and push."
            exit 1
          fi
          echo "OK: origin/main is caught up with the release commit."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Type gate: full workspace tsc. Catches type debt that esbuild/tsup
      # transpile-only builds skip. Must stay green before any release —
      # this is the gate that blocked v0.11.0 until the TS5103-masked
      # errors were fixed.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Pre-publish gate: pack every workspace package as a tarball, install
      # into a clean project, smoke-test the artifacts that actually ship.
      # Catches the v0.10.4 class of bug (import declared `external` in tsup
      # but missing from `dependencies`).
      - name: Clean-install smoke test
        run: bun run scripts/test-clean-install.ts

      # Dry-run gate: validates package discovery, topological publish order,
      # and already-published classification. Mutates nothing, publishes
      # nothing. Fails the run before any release if the plan is broken.
      - name: Release plan (dry-run gate)
        run: bun scripts/release.ts ${{ steps.ver.outputs.version }} --dry-run

      # release.ts shells `bun publish`. Write the literal token (NOT a
      # ${VAR} placeholder — bun does not interpolate .npmrc the way npm
      # does) to whatever config path is in effect: NPM_CONFIG_USERCONFIG
      # if some action still set it, else $HOME/.npmrc. Fail fast if any
      # placeholder slipped through. This is the v0.11.0 auth fix (#3).
      # Runs only after install, build, typecheck and tests, so dependency
      # install scripts and test code never see the token (security audit
      # 2026-11-12).
      - name: Authenticate bun + npm to registry
        run: |
          set -euo pipefail
          AUTHFILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$AUTHFILE"
          echo "auth written to: $AUTHFILE"
          if grep -qE '\$\{[A-Z_]+\}' "$AUTHFILE"; then
            echo "::error::placeholder unexpanded in $AUTHFILE"; exit 1
          fi
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "config lines (redacted):"
          sed 's/_authToken=.*/_authToken=<redacted>/' "$AUTHFILE"
          echo "npm identity check:"; npm whoami || echo "(npm whoami failed — bun publish may still succeed via .npmrc)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Real release: aggregate CHANGELOG, consume changesets, stamp all
      # public packages + root to the single version, build, publish in
      # dependency order. Fail-fast; re-runnable (already-published skipped).
      - name: Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release.ts ${{ steps.ver.outputs.version }}

      # Sync the release artifacts back to main: VERSION (so `cat VERSION` ==
      # npm @latest), the CHANGELOG.md section release.ts just aggregated,
      # the deletion of the changesets it consumed, and the 34 stamped
      # packages/*/package.json files release.ts wrote in this tag workspace,
      # plus the two public apps (apps/cli, apps/cortex).
      # Without the changeset deletion, consumed changesets linger on main
      # and re-aggregate into the NEXT release's notes (bit v0.11.2: seven
      # v0.11.0-era notes had to be purged by hand). Without the package.json
      # sync, npm ends up ahead of the repo on every single release — found
      # 2026-09-03 as a 5-release drift across all 34 packages, caught by
      # scripts/check-version-sync.sh, root-caused to this step never having
      # carried package.json across the branch switch below.
      # [skip ci] prevents a docs/publish re-trigger loop.
      # Known tradeoff: if main's CHANGELOG gained edits between the tagged
      # commit and this step, the release-generated copy wins.
      - name: Sync VERSION + CHANGELOG + consumed changesets to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Preserve release.ts outputs from the tag workspace before the
          # branch switch discards them.
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.release.md"
          ls .changeset/ > "$RUNNER_TEMP/changesets-remaining.txt"
          # The two public apps (@reactive-agents/cli, @reactive-agents/cortex)
          # are stamped by release.ts too; leaving them out let the facade's
          # cli pin move to the release while apps/cli stayed behind, so bun
          # installed a stale npm cli under the facade. Explicit paths: the
          # other apps/* are private and keep their own versions.
          tar -cf "$RUNNER_TEMP/package-jsons.tar" packages/*/package.json \
            apps/cli/package.json apps/cortex/package.json
          git fetch origin main
          git checkout -f -B main origin/main
          echo "${{ steps.ver.outputs.version }}" > VERSION
          cp "$RUNNER_TEMP/CHANGELOG.release.md" CHANGELOG.md
          tar -xf "$RUNNER_TEMP/package-jsons.tar"
          # Remove any changeset note present on main but absent from the
          # post-release workspace (i.e. consumed by release.ts).
          for f in .changeset/*.md; do
            [ -e "$f" ] || continue
            if ! grep -qx "$(basename "$f")" "$RUNNER_TEMP/changesets-remaining.txt"; then
              git rm -q "$f"
            fi
          done
          git add VERSION CHANGELOG.md .changeset/ packages/*/package.json \
            apps/cli/package.json apps/cortex/package.json
          if git diff --cached --quiet; then
            echo "release artifacts already synced — nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): sync VERSION/CHANGELOG/changesets → ${{ steps.ver.outputs.version }} [skip ci]"
          git push origin main

      - name: Create consolidated GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          EXISTING="$RUNNER_TEMP/release-existing.md"

          # scripts/release-notes.ts builds the body from this version's
          # CHANGELOG.md section, cut under GitHub's 125000-char limit (v0.18.0
          # and v0.19.0 failed here with HTTP 422 body too long), and prints one
          # action: create (no release), edit (empty or script-written body) or
          # keep (hand-written body, never overwritten).
          if gh release view "v${VERSION}" --json body --jq .body > "$EXISTING" 2>/dev/null; then
            ACTION=$(bun scripts/release-notes.ts "$VERSION" "$NOTES" "$EXISTING")
          else
            ACTION=$(bun scripts/release-notes.ts "$VERSION" "$NOTES")
          fi

          case "$ACTION" in
            create)
              gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$NOTES" --target main ;;
            edit)
              gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file "$NOTES" ;;
            keep)
              echo "release v${VERSION} has a hand-written body; left unchanged" ;;
            *)
              echo "release-notes.ts printed an unknown action: ${ACTION}" >&2
              exit 1 ;;
          esac
