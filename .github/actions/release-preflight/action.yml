name: Release preflight
description: >-
  The pre-publish steps every release runs: toolchain, frozen install, build,
  typecheck, tests, clean-install smoke and the release.ts dry-run plan.
  Shared by publish.yml (before the npm publish) and release-rehearsal.yml
  (on dev, nothing published) so the rehearsal cannot drift from the release.
  Pinned by tools/repo/tests/release-rehearsal.test.ts. Publishes nothing and
  reads no secrets; the caller checks out the repo first.

inputs:
  version:
    description: "Semver the release plan is computed for (e.g. 0.19.2)."
    required: true

runs:
  using: composite
  steps:
    # No `registry-url:` — it makes setup-node write a placeholder
    # $RUNNER_TEMP/.npmrc and export NPM_CONFIG_USERCONFIG pointing at it.
    # bun honors NPM_CONFIG_USERCONFIG but does NOT expand the
    # ${NODE_AUTH_TOKEN} placeholder, so `bun publish` fails auth. Omitting
    # registry-url leaves $HOME/.npmrc as the sole npm/bun config path.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.10"

    - name: Cache Bun install
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build
      shell: bash
      run: bun run build

    # Type gate: full workspace tsc. Catches type debt that esbuild/tsup
    # transpile-only builds skip. Must stay green before any release —
    # this is the gate that blocked v0.11.0 until the TS5103-masked
    # errors were fixed.
    - name: Typecheck
      shell: bash
      run: bun run typecheck

    # Same env as ci.yml's `bun test` step (pinned equal by
    # release-rehearsal.test.ts): without REPO_BUDGET_FACTOR the tools/repo
    # latency budgets fail on shared runners (rehearsal run 44784760800).
    - name: Test
      shell: bash
      env:
        # scales tools/repo latency-budget tests for slow shared runners
        REPO_BUDGET_FACTOR: "3"
      run: bun test

    # Pre-publish gate: pack every workspace package as a tarball, install
    # into a clean project, smoke-test the artifacts that actually ship.
    # Catches the v0.10.4 class of bug (import declared `external` in tsup
    # but missing from `dependencies`).
    - name: Clean-install smoke test
      shell: bash
      run: bun run scripts/test-clean-install.ts

    # Dry-run gate: validates package discovery, topological publish order,
    # and already-published classification. Mutates nothing, publishes
    # nothing. Fails the run before any release if the plan is broken.
    - name: Release plan (dry-run gate)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: bun scripts/release.ts "$VERSION" --dry-run
