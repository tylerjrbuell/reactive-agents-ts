<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cortex — Reactive Agents Studio</title>
    <!-- Fonts are self-hosted (fontsource, imported in app.css) and icons are
         inline SVG (kit/Icon.svelte): nothing loads from a font CDN. -->
    <script>
      // Apply the saved theme (lib/theme.ts) and motion setting before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem("cortex-settings") || "{}");
        var light =
          s.theme === "light" ||
          (s.theme === "system" && !window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (light) document.documentElement.classList.remove("dark");
        if (s.motion === "reduce") document.documentElement.setAttribute("data-motion", "reduce");
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body
    class="bg-canvas text-text overflow-hidden h-screen w-screen"
    data-sveltekit-preload-data="hover"
  >
    <div id="svelte" class="h-full w-full">%sveltekit.body%</div>
  </body>
</html>
