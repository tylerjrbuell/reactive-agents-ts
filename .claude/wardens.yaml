# yaml-language-server: $schema=https://raw.githubusercontent.com/tylerjrbuell/wardens/main/schema/wardens.schema.json
#
# The warden team for this repo: who owns what, and what each may run. One file, committed.
# Agent prompts (domain primers) live in .claude/agents/<name>.md. Runtime state lives in .wardens/ (gitignored).
# Docs: https://github.com/tylerjrbuell/wardens · Contract + FSM: AGENTS.md §Team-Ownership Dev Contract
#
# Domain wardens' owned paths are NOT listed here: they come from tools/repo/ownership.json (ownership-file
# below), the same map `bun run repo scope` uses, so ownership has one source of truth.
#
# Domain wardens' `run` lists mirror what their primers instruct: `bun run repo` for scope/test/verify/check,
# the package typecheck and tests, `bash scripts/check-*.sh`, and the documented check lane
# `for s in scripts/check-*.sh; do bash "$s"; done` (allowed as its three shell segments), and the docs
# metrics sync for new test files (`bun run --cwd apps/docs metrics`, `metrics:sync-readme`).
# `git stash` is banned here (the working tree is shared with concurrent agents) and is a wardens built-in never-run.
version: 1

# enforce: deny out-of-authority tool calls and invalid briefs/reports.  warn: record them only (start here).
mode: warn

# Confidence at or above this must be backed by `verification` in the UpwardReport (default 0.7).
# confidence-floor: 0.7

# Read owned globs from an existing [{glob, owner}] map instead of listing them here.
ownership-file: tools/repo/ownership.json

# Commands no warden may run, on top of the built-ins (git commit/push/tag/rebase, git stash/clean/reset --hard/restore, *publish).
# never-run:
#   - terraform apply

wardens:
  ablation-warden:
    kind: specialist
    owns:
      - wiki/Research/Ablations/**
    run:
      - bun run repo
      - bun run
      - bun test
      - bunx turbo run typecheck
      - bun .agents/skills/harness-improvement-loop
      - bun packages/benchmarks
      - node
      - git
      - find

  compose-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/compose
      - bun run --cwd apps/docs metrics
      - bun test packages/compose
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  core-warden:
    kind: domain
    run:
      - bun run repo
      - bun test packages/core
      - bun test packages/runtime-shim
      - bun test packages/observability
      - bun test packages/observe
      - bun test packages/testing
      - bunx turbo run typecheck
      - bunx turbo run build --filter=@reactive-agents/core
      - bun run --cwd apps/docs metrics
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  cortex-warden:
    kind: domain
    run:
      - bun run repo
      - bun test apps/cortex
      - bun test packages/ui-core
      - bun test packages/react
      - bun test packages/svelte
      - bun test packages/vue
      - bunx turbo run typecheck --filter=@reactive-agents/ui-core
      - bunx turbo run typecheck --filter=@reactive-agents/react
      - bunx turbo run typecheck --filter=@reactive-agents/svelte
      - bunx turbo run typecheck --filter=@reactive-agents/vue
      - bun run --cwd apps/cortex
      - bun run build:packages
      - bun run --cwd apps/docs metrics
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  debrief-scribe:
    kind: specialist
    owns:
      - wiki/Research/Debriefs/**
    run:
      - bun run repo
      - find

  docs-warden:
    kind: domain
    run:
      - bun run repo
      - bun run --cwd apps/docs
      - bun test apps/docs
      - bunx --cwd apps/docs astro
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - node
      - git diff
      - git status
      - find

  eval-warden:
    kind: domain
    run:
      - bun run repo
      - bun test packages/eval
      - bun test packages/judgment
      - bun test packages/judge-server
      - bun test packages/verification
      - bunx turbo run typecheck --filter=@reactive-agents/eval
      - bunx turbo run typecheck --filter=@reactive-agents/judgment
      - bunx turbo run typecheck --filter=@reactive-agents/judge-server
      - bunx turbo run typecheck --filter=@reactive-agents/verification
      - bun run --cwd apps/docs metrics
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  gateway-warden:
    kind: domain
    run:
      - bun run repo
      - bun test packages/gateway
      - bun test packages/channels
      - bun test packages/a2a
      - bun test apps/cli/tests/deploy.test.ts
      - bunx turbo run typecheck --filter=@reactive-agents/gateway
      - bunx turbo run typecheck --filter=@reactive-agents/channels
      - bunx turbo run typecheck --filter=@reactive-agents/a2a
      - bun run --cwd apps/cli
      - bun run --cwd apps/docs metrics
      - docker compose config
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  harness-warden:
    kind: specialist
    owns:
      - .agents/skills/harness-improvement-loop/**
    run:
      - bun run repo
      - bun run
      - bun test
      - bunx turbo run typecheck
      - bun .agents/skills/harness-improvement-loop
      - rax-diagnose
      - node
      - git
      - find

  kernel-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/reasoning
      - bun run --cwd apps/docs metrics
      - bun test packages/reasoning
      - bun test packages/reactive-intelligence
      - bun test packages/prompts
      - bunx turbo run typecheck --filter=@reactive-agents/prompts
      - bunx turbo run typecheck --filter=@reactive-agents/reactive-intelligence
      - bunx turbo run build --filter=@reactive-agents/reactive-intelligence
      - bun test seam
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - bunx turbo run build --filter=@reactive-agents/reasoning
      - bun run --cwd packages/benchmarks src/replay-lane-cli.ts
      - git diff
      - git status
      - find

  memory-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/memory
      - bun run --cwd apps/docs metrics
      - bun test packages/memory
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  provider-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/llm-provider
      - bun run --cwd apps/docs metrics
      - bun test packages/llm-provider
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  release-warden:
    kind: specialist
    owns:
      - wiki/Research/Release-Audits/**
    run:
      - bun run repo
      - bun run release:dry
      - bunx turbo run build
      - bunx turbo run typecheck
      - bun test
      - npm view
      - git tag --list
      - find

  runtime-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/runtime
      - bunx turbo run typecheck --filter=reactive-agents
      - bun run --cwd apps/docs metrics
      - bun test packages/runtime
      - bun test packages/interaction
      - bun test packages/cost
      - bun test packages/health
      - bunx turbo run typecheck --filter=@reactive-agents/interaction
      - bunx turbo run typecheck --filter=@reactive-agents/cost
      - bunx turbo run typecheck --filter=@reactive-agents/health
      - bun test seam
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  tools-warden:
    kind: domain
    run:
      - bun run repo
      - bunx turbo run typecheck --filter=@reactive-agents/tools
      - bun run --cwd apps/docs metrics
      - bun test packages/tools
      - bun test packages/guardrails
      - bun test packages/identity
      - bunx turbo run typecheck --filter=@reactive-agents/guardrails
      - bunx turbo run typecheck --filter=@reactive-agents/identity
      - docker inspect
      - docker logs
      - docker ps
      - bash scripts
      - for s in scripts
      - do bash
      - done
      - git diff
      - git status
      - find

  evidence-warden:          # bundled with the plugin; this repo's ablation-warden is the specialised version
    kind: specialist
    owns:
      - wiki/Research/Ablations/**
